<!doctype html>
<html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Birmarket və Temu CSV</title><link rel="stylesheet" href="styles.css"></head>
<body class="popup"><header><span class="logo">B</span><div><h1>Birmarket + Temu → CSV</h1><p>Məhsul kolleksiyası</p></div></header>
<main><p class="intro">Birmarket və ya Temu məhsulunu açın, yüklənməsini gözləyin və yadda saxlayın.</p>
<button id="capture" class="primary">Bu məhsulu yadda saxla</button>
<p class="count"><strong id="count">0</strong> məhsul yadda saxlanılıb</p>
<button id="manage">Kolleksiyanı aç</button><button id="export">Tam CSV yüklə · şəkil linkləri ilə</button>
<p id="status" class="status" role="status" aria-live="polite"></p>
<p class="hint">Mağaza qiyməti, maya dəyəri və stok kolleksiya ekranında doldurulur. Tam CSV mənbə məlumatlarını və foto linklərini saxlayır.</p>
</main><script type="module" src="popup.js"></script></body></html>
